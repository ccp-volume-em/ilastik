name: Build ilastik container images and publish to Quay.io

on:
  workflow_dispatch:
    inputs:
      ilastik_version:
        description: ilastik version (e.g. 1.4.2)
        type: string
        required: true
      virtualgl_version:
        description: VirtualGL version for -gpu-vgl tag (e.g. 3.1.4)
        type: string
        default: '3.1.4'
      latest:
        description: Set latest tag (on the -cpu image)
        type: boolean
        default: false

env:
  IMAGE: quay.io/ccp-volume-em/ilastik

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            file: Dockerfile
            target: ''
          - variant: gpu
            file: Dockerfile-gpu
            target: gpu
          - variant: gpu-vgl
            file: Dockerfile-gpu
            target: vgl
    steps:
      - uses: actions/checkout@v6

      - name: Get build timestamp
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
          tags: |
            ${{ env.IMAGE }}:${{ inputs.ilastik_version }}-${{ matrix.variant }}
            ${{ (matrix.variant == 'cpu' && inputs.latest) && format('{0}:latest', env.IMAGE) || '' }}
          build-args: |
            ILASTIK_VERSION=${{ inputs.ilastik_version }}
            VGL_VERSION=${{ inputs.virtualgl_version }}
            IMAGE_VERSION=${{ inputs.ilastik_version }}-${{ matrix.variant }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.meta.outputs.created }}

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${DIGEST}" > digest-${{ matrix.variant }}.txt

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.variant }}
          path: digest-${{ matrix.variant }}.txt

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: sigstore/cosign-installer@v4.1.0

      - name: Sign images
        run: |
          for f in digest-*.txt; do
            cosign sign --yes "${IMAGE}@$(cat "$f")"
          done

      - name: Verify signatures
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-publish.yml@${{ github.ref }}
        run: |
          for f in digest-*.txt; do
            cosign verify "${IMAGE}@$(cat "$f")" \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
